<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080609" />
    <title>You're offline · SwiftPay</title>
    <style>
      :root { color-scheme: dark light; --bg: #080609; --fg: #f6f3fb; --muted: #a39cb3; --card: #141019; --border: #2a2333; --primary: #6d4ae8; }
      @media (prefers-color-scheme: light) {
        :root { --bg: #f4ebdd; --fg: #1c1622; --muted: #6b6275; --card: #fffaf2; --border: #e5d9c7; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%; max-width: 380px; text-align: center; padding: 32px 24px;
        background: var(--card); border: 1px solid var(--border); border-radius: 24px;
      }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { margin: 20px 0 8px; font-size: 22px; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
      button {
        margin-top: 24px; width: 100%; height: 46px; border: 0; border-radius: 999px;
        background: var(--primary); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
      }
      small { display: block; margin-top: 14px; color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <img alt="SwiftPay" src="/icons/icon-192.png" />
      <h1>You're offline</h1>
      <p>SwiftPay needs a connection to show your balances and move money. Nothing was sent while you were offline.</p>
      <button onclick="location.reload()" type="button">Try again</button>
      <small>We'll reconnect as soon as you're back online.</small>
    </main>
    <script>
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
