packages:
  - 'apps/*'
  - 'packages/*'

engineStrict: true

overrides:
  '@wagmi/connectors': '6.2.0'
  # Security patches for wallet-SDK dependencies, each kept within its major.
  'axios@>=1.0.0 <1.18.0': '^1.18.0'
  'socket.io-parser@>=4.0.0 <4.2.7': '^4.2.7'
  'undici@>=6.0.0 <6.27.0': '^6.27.0'
  'ws@>=8.0.0 <8.21.0': '^8.21.0'

onlyBuiltDependencies:
  - '@reown/appkit'
  - bufferutil
  - esbuild
  - keccak
  - protobufjs
  - sharp
  - utf-8-validate